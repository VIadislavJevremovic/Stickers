<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panini WC 2026 — Duplicate Stickers</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 0; color: #111; background: #fff;
    font-size: 10pt;
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 8px;
  }
  h1 { font-size: 15pt; margin: 0; letter-spacing: .5px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .card {
    border: 1px solid #bbb; border-radius: 4px;
    padding: 4px 5px 5px;
    break-inside: avoid;
  }
  .head {
    display: flex; align-items: baseline; gap: 4px;
    border-bottom: 1px solid #ddd; padding-bottom: 2px; margin-bottom: 4px;
  }
  .code { font-weight: 700; font-size: 12pt; letter-spacing: .5px; }
  .name { font-size: 8pt; color: #666; text-transform: uppercase; letter-spacing: .3px;
          overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .nums { display: flex; flex-wrap: wrap; gap: 3px; }
  .num {
    width: 22px; height: 22px;
    border: 1px solid #333; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11pt; font-variant-numeric: tabular-nums;
  }
  @media screen { body { padding: 14px; max-width: 820px; margin: 0 auto; } }
</style>
</head>
<body>
<header>
  <h1>PANINI WC 2026 — DUPLICATES</h1>
</header>
<div class="grid" id="grid"></div>

<script>
const data = [
  ["ALG","Algeria",[]],
  ["ARG","Argentina",[9]],
  ["AUS","Australia",[7,9,13,16]],
  ["AUT","Austria",[9,13,16,18,19,20]],
  ["BEL","Belgium",[4,5,9]],
  ["BIH","Bosnia & Herzegovina",[1,18,20,20]],
  ["BRA","Brazil",[20]],
  ["CAN","Canada",[8,14,15]],
  ["CIV","Cote d'Ivoire",[5,10,13,14,19]],
  ["COD","DR Congo",[3,16,19]],
  ["COL","Colombia",[1,1,17]],
  ["CPV","Cape Verde",[]],
  ["CRO","Croatia",[1,17,19]],
  ["CUW","Curacao",[3,5,9,10,16,17,18]],
  ["CZE","Czechia",[11]],
  ["ECU","Ecuador",[2,10,16,16,18]],
  ["EGY","Egypt",[1,10]],
  ["ENG","England",[12,13,14]],
  ["ESP","Spain",[8]],
  ["FRA","France",[10]],
  ["GER","Germany",[3,9,20]],
  ["GHA","Ghana",[1,14]],
  ["HAI","Haiti",[]],
  ["IRN","Iran",[1,1,15,15,18]],
  ["IRQ","Iraq",[]],
  ["JOR","Jordan",[2,8,15,19]],
  ["JPN","Japan",[1,1,13]],
  ["KOR","Korea Rep.",[1,6,13,13]],
  ["KSA","Saudi Arabia",[8,13,14,15,16]],
  ["MAR","Morocco",[2,2,2,3,5,5,7,8,10,17,19]],
  ["MEX","Mexico",[17,20]],
  ["NED","Netherlands",[5,7,15,15,15]],
  ["NOR","Norway",[3,6,14,17,18]],
  ["NZL","New Zealand",[2,7,11,14,20]],
  ["PAN","Panama",[2,3]],
  ["PAR","Paraguay",[20]],
  ["POR","Portugal",[5,10]],
  ["QAT","Qatar",[2,8,8,8,10,20,20]],
  ["RSA","South Africa",[1,6,6,10,20]],
  ["SCO","Scotland",[1,2,5,8,14]],
  ["SEN","Senegal",[6,13]],
  ["SUI","Switzerland",[1,8,15]],
  ["SWE","Sweden",[1,4,4,13,13,13]],
  ["TUN","Tunisia",[1,18]],
  ["TUR","Turkiye",[1,3,3,4,7,8,8,14,17,20]],
  ["URU","Uruguay",[13,17,17,18,19]],
  ["USA","United States",[7,7,8,13]],
  ["UZB","Uzbekistan",[6,6,11,11]],
  ["FWC","FIFA World Cup",[7]],
];

const grid = document.getElementById("grid");
for (const [code, name, nums] of data) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="head"><span class="code">' + code + '</span>' +
    '<span class="name">' + name + '</span></div>' +
    '<div class="nums">' + nums.map(n => '<span class="num">' + n + '</span>').join("") + '</div>';
  grid.appendChild(card);
}
</script>
</body>
</html>
