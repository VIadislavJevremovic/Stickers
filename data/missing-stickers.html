<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Panini WC 2026 — Missing Stickers</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    margin: 0; color: #111; background: #fff;
    font-size: 10pt;
  }
  header {
    display: flex; align-items: baseline; gap: 10px;
    border-bottom: 2px solid #111; padding-bottom: 4px; margin-bottom: 8px;
  }
  h1 { font-size: 15pt; margin: 0; letter-spacing: .5px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
  }
  .card {
    border: 1px solid #bbb; border-radius: 4px;
    padding: 4px 5px 5px;
    break-inside: avoid;
  }
  .head {
    display: flex; align-items: baseline; gap: 4px;
    border-bottom: 1px solid #ddd; padding-bottom: 2px; margin-bottom: 4px;
  }
  .code { font-weight: 700; font-size: 12pt; letter-spacing: .5px; }
  .name { font-size: 8pt; color: #666; text-transform: uppercase; letter-spacing: .3px;
          overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .nums { display: flex; flex-wrap: wrap; gap: 3px; }
  .num {
    width: 22px; height: 22px;
    border: 1px solid #333; border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11pt; font-variant-numeric: tabular-nums;
  }
  @media screen { body { padding: 14px; max-width: 820px; margin: 0 auto; } }
</style>
</head>
<body>
<header>
  <h1>PANINI WC 2026 — MISSING</h1>
</header>
<div class="grid" id="grid"></div>

<script>
const data = [
  ["ALG","Algeria",[4,9,10,13,16,18]],
  ["ARG","Argentina",[2,7,11,14,20]],
  ["AUS","Australia",[2,15,20]],
  ["AUT","Austria",[4]],
  ["BEL","Belgium",[2,11,13,14,17,19]],
  ["BIH","Bosnia & Herzegovina",[16]],
  ["BRA","Brazil",[8]],
  ["CAN","Canada",[20]],
  ["CIV","Cote d'Ivoire",[4,6]],
  ["COD","DR Congo",[15,18,20]],
  ["COL","Colombia",[]],
  ["CPV","Cape Verde",[1,3,5,6,11]],
  ["CRO","Croatia",[2,8]],
  ["CUW","Curacao",[13,14]],
  ["CZE","Czechia",[7,8]],
  ["ECU","Ecuador",[12,13,19,20]],
  ["EGY","Egypt",[7,8,11,16,17]],
  ["ENG","England",[3,6,10,17]],
  ["ESP","Spain",[6,7,11,19]],
  ["FRA","France",[4,11]],
  ["GER","Germany",[7,8,11,13]],
  ["GHA","Ghana",[2,6,20]],
  ["HAI","Haiti",[3,10,12,14]],
  ["IRN","Iran",[3,5,7,8,13,16]],
  ["IRQ","Iraq",[]],
  ["JOR","Jordan",[7,16]],
  ["JPN","Japan",[5,8,9,17,19]],
  ["KOR","Korea Rep.",[2,3]],
  ["KSA","Saudi Arabia",[3,6,20]],
  ["MAR","Morocco",[9,14,16]],
  ["MEX","Mexico",[5,13,18]],
  ["NED","Netherlands",[1,2,4,6,14,20]],
  ["NOR","Norway",[10,15]],
  ["NZL","New Zealand",[8,10,14,15,18,19]],
  ["PAN","Panama",[6,12,15]],
  ["PAR","Paraguay",[2,13,14,18,19]],
  ["POR","Portugal",[9]],
  ["QAT","Qatar",[]],
  ["RSA","South Africa",[4,11,14,16,18]],
  ["SCO","Scotland",[6,10,12,16]],
  ["SEN","Senegal",[5]],
  ["SUI","Switzerland",[4,13,16]],
  ["SWE","Sweden",[2,7,9,10,15,19]],
  ["TUN","Tunisia",[3,4,7,15,20]],
  ["TUR","Turkiye",[18,19]],
  ["URU","Uruguay",[1,5,7,12]],
  ["USA","United States",[4,18]],
  ["UZB","Uzbekistan",[7,14]],
  ["FWC","FIFA World Cup",[2,4,15]],
];

const grid = document.getElementById("grid");
for (const [code, name, nums] of data) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="head"><span class="code">' + code + '</span>' +
    '<span class="name">' + name + '</span></div>' +
    '<div class="nums">' + nums.map(n => '<span class="num">' + n + '</span>').join("") + '</div>';
  grid.appendChild(card);
}
</script>
</body>
</html>
